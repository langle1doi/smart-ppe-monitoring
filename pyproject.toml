[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ppe"
version = "0.1.0"
description = "YOLO vs RT-DETR helmet/PPE detection with a cautious compliance layer"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "ultralytics==8.3.27", "opencv-python>=4.8", "numpy>=1.24,<2", "PyYAML>=6",
  "pandas>=2", "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
